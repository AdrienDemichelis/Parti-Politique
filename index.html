<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parti Impulsion – Parti politique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F8FB;--surface:#fff;--ink:#0E1E33;--mute:#51627A;--blue:#0B3A7A;--blue2:#1F66C9;--green:#17A36B;--green-l:#DFF3EA;--line:#D5E0EB;--on-blue:#fff;
--fd:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Public Sans',system-ui,sans-serif;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1424;--surface:#12223A;--ink:#E8F0FA;--mute:#9DB0C8;--blue:#6FA8F5;--blue2:#4C8BE0;--green:#3CCB92;--green-l:#12382F;--line:#24385A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1424;--surface:#12223A;--ink:#E8F0FA;--mute:#9DB0C8;--blue:#6FA8F5;--blue2:#4C8BE0;--green:#3CCB92;--green-l:#12382F;--line:#24385A;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--fb)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
h1,h2,h3{font-family:var(--fd);line-height:1.12;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800}h2{font-size:clamp(1.8rem,3.5vw,2.6rem);font-weight:700}h3{font-size:1.25rem;font-weight:700}
a{color:inherit}p{margin:0 0 1em;max-width:68ch}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:24px;min-height:68px;flex-wrap:wrap}
.logo{font:800 1.3rem var(--fd);text-decoration:none;color:var(--blue);display:flex;gap:10px;align-items:center}
.logo i{width:28px;height:28px;border-radius:50% 50% 50% 0;background:linear-gradient(135deg,var(--blue2) 50%,var(--green) 50%)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{padding:8px 14px;border-radius:99px;text-decoration:none;font-weight:600;font-size:.95rem}
nav a:hover{background:var(--green-l)}nav a.on{background:var(--blue);color:var(--on-blue)}
:root[data-theme="dark"] nav a.on,:root:not([data-theme="light"]) nav a.on{color:#0A1424}
@media (prefers-color-scheme:light){nav a.on{color:#fff}}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--green);color:#04281B;font:700 1rem var(--fb);padding:13px 24px;border-radius:99px;text-decoration:none}
.btn.alt{background:transparent;border:2px solid currentColor;color:inherit}
:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}
.ph{background:repeating-linear-gradient(135deg,var(--green-l) 0 14px,var(--surface) 14px 28px);border:2px dashed var(--green);border-radius:14px;display:grid;place-items:center;color:var(--mute);font-weight:600;font-size:.9rem;text-align:center;padding:10px;min-height:160px}
.hero{background:var(--blue);color:#fff;padding:72px 0}
.hero .g{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero p{font-size:1.15rem;opacity:.92}.hero .ph{min-height:380px;background:rgba(255,255,255,.08);border-color:#7be0b8;color:#d7e6fb}
.hero .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.stats{display:flex;gap:32px;flex-wrap:wrap;margin-top:36px}.stats b{display:block;font:800 2rem var(--fd);color:#7be0b8}
section.s{padding:72px 0}section.alt{background:var(--surface);border-block:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}.head h2{margin:0}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tab{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--green);border-radius:10px;padding:22px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.tab:hover{border-left-color:var(--blue2);background:var(--green-l)}.tab h3{margin:0 0 6px}.tab span{color:var(--mute);font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{border:0;border-radius:0;min-height:170px}.card .b{padding:18px}.card .b p{color:var(--mute);margin:0;font-size:.97rem}
.card.link{cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0}.card.link:hover{border-color:var(--green)}
.tag{display:inline-block;background:var(--green-l);color:var(--blue);font-weight:600;font-size:.82rem;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.page{padding:56px 0 80px}.page>.w>h1{font-size:clamp(2.2rem,5vw,3.4rem);color:var(--blue)}
.prog{display:grid;grid-template-columns:240px 1fr;gap:44px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);align-self:start;display:flex;flex-direction:column;gap:4px}
.side a{padding:9px 12px;border-radius:8px;text-decoration:none;font-weight:600;font-size:.95rem;border-left:4px solid transparent}.side a:hover{background:var(--green-l);border-color:var(--green)}
.pt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;margin-bottom:22px}
.pt ul{margin:0;padding-left:1.2em}.pt li{margin-bottom:.6em;padding-left:.2em}.pt li::marker{color:var(--green)}
.ev{display:grid;grid-template-columns:300px 1fr;gap:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px}
.ev .ph{border:0;border-radius:0;height:100%}.ev .b{padding:22px 22px 22px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;margin-bottom:56px}
.vals{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.vals div{border-top:5px solid var(--green);background:var(--surface);padding:20px;border-radius:0 0 12px 12px}
.tl{border-left:4px solid var(--green);padding-left:22px;margin-left:8px}.tl div{margin-bottom:22px}.tl b{font-family:var(--fd);color:var(--blue);font-size:1.2rem}
.price{font:800 1.3rem var(--fd);color:var(--blue)}.card .b .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.btn.sm{padding:8px 16px;font-size:.9rem}
.cart{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40}
.cart>button{background:var(--blue);color:#fff;border:0;border-radius:99px;padding:14px 22px;font:700 1rem var(--fb);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.cart .pan{position:absolute;right:0;bottom:60px;width:min(340px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cart .pan div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.note{background:var(--green-l);border-radius:10px;padding:12px 16px;font-size:.92rem;margin:12px 0}
footer{background:var(--blue);color:#fff;padding:48px 0 32px;margin-top:0}footer .grid{grid-template-columns:2fr 1fr 1fr}footer a{display:block;opacity:.85;text-decoration:none;margin-bottom:6px}footer small{opacity:.7}
@media (max-width:820px){.hero .g,.prog,.two,.ev,footer .grid{grid-template-columns:1fr}.side{position:static;flex-direction:row;flex-wrap:wrap}.ev .b{padding:0 20px 20px}.hero .ph{min-height:220px}nav{margin-left:0}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="w bar">
 <a class="logo" href="#accueil"><i></i><span id="nom"></span></a>
 <nav id="nav"></nav>
</div></header>
<main id="app"></main>
<footer><div class="w grid" id="foot"></div></footer>
<div class="cart" id="cart"></div>

<script>
/* ============ CONTENU À MODIFIER ============ */
const PARTI={nom:'Parti Impulsion',slogan:`Construisons ensemble un avenir plus juste et plus durable`,
 intro:`Un mouvement citoyen qui réunit des femmes et des hommes de tous horizons autour d’un projet : une société solidaire, une économie qui respecte la planète.`,
 stats:[['12 000','adhérents'],['94','élus locaux'],['35','fédérations']],
 contact:{mail:'contact@exemple.fr',tel:'01 23 45 67 89',adresse:'12 rue de l’Exemple, 75000 Ville'}};
const PROGRAMME=[
 {t:'Économie & emploi',r:'Une économie au service de tous',p:['Soutien aux PME et aux artisans','Formation tout au long de la vie','Hausse du pouvoir d’achat','Simplification administrative']},
 {t:'Écologie & énergie',r:'Réussir la transition',p:['Rénovation thermique des logements','Développement des énergies renouvelables','Transports publics accessibles','Protection de la biodiversité']},
 {t:'Santé & solidarité',r:'Des soins pour chacun',p:['Lutte contre les déserts médicaux','Aide aux aidants et aux seniors','Prévention et santé mentale','Hôpital public renforcé']},
 {t:'Éducation & jeunesse',r:'Donner à chaque jeune sa chance',p:['Réduction des effectifs par classe','Soutien aux enseignants','Accès à la culture et au sport','Aide au premier logement']},
 {t:'Affaires étrangères',r:'Protéger et garantir l’égalité devant la loi',p:['Police de proximité','Justice plus rapide','Prévention de la délinquance','Soutien aux victimes']},
 {t:'Démocratie & liberté',r:'Rapprocher les décisions des citoyens',p:['Budgets participatifs','Services publics dans chaque territoire','Transparence de la vie publique','Référendums d’initiative citoyenne']}];
const EVENTS=[
 {d:'12 déc. 2026',t:'Grande réunion publique',l:'Salle des fêtes',x:'Venez échanger avec nos élus et découvrir notre projet pour les prochaines années.'},
 {d:'18 déc. 2026',t:'Atelier citoyen : écologie',l:'Maison des associations',x:'Un atelier participatif pour construire ensemble nos propositions sur la transition écologique.'},
 {d:'09 janv. 2027',t:'Université d’hiver',l:'Centre de congrès',x:'Deux jours de conférences, débats et rencontres avec des experts et des militants.'}];
const NEWS=[
 {d:'10 nov. 2026',c:'Communiqué',t:'Notre position sur le budget',x:'Résumé court de l’article : quelques lignes pour donner envie de lire la suite.'},
 {d:'05 nov. 2026',c:'Terrain',t:'Retour sur la tournée des territoires',x:'Résumé court de l’article : quelques lignes pour donner envie de lire la suite.'},
 {d:'28 oct. 2026',c:'Interview',t:'Notre présidente répond à vos questions',x:'Résumé court de l’article : quelques lignes pour donner envie de lire la suite.'}];
const SHOP=[
 {n:'T-shirt militant',p:20},{n:'Tote bag',p:12},{n:'Casquette',p:18},{n:'Mug',p:9},{n:'Sweat à capuche',p:45},{n:'Lot de badges',p:5}];
const PARTIE={histoire:[['2015','Naissance du mouvement','Quelques mots sur la fondation du parti.'],['2018','Premiers élus locaux','Quelques mots sur cette étape.'],['2022','Un parti national','Quelques mots sur cette étape.'],['2026','Aujourd’hui','Quelques mots sur l’actualité du parti.']],
 valeurs:[['Solidarité','Description de cette valeur en une ou deux phrases.'],['Écologie','Description de cette valeur en une ou deux phrases.'],['Démocratie','Description de cette valeur en une ou deux phrases.'],['Progrès','Description de cette valeur en une ou deux phrases.']]};
/* ============ FIN CONTENU ============ */

const $=s=>document.querySelector(s);
const ph=(t,c='')=>`<div class="ph ${c}">${t}</div>`;
const LINKS=[['accueil','Accueil'],['programme','Programme'],['agenda','Agenda'],['parti','Notre Parti'],['boutique','Boutique']];
let cart=[],open=false;

const eventCard=(e,i)=>`<a class="card link" href="#agenda" style="text-decoration:none">${ph('Photo de l’événement (16:9)')}<div class="b"><span class="tag">${e.d}</span><h3>${e.t}</h3><p>${e.x}</p></div></a>`;

const V={
accueil:()=>`
<section class="hero"><div class="w g"><div>
 <h1>${PARTI.slogan}</h1><p>${PARTI.intro}</p>
 <div class="btns"><a class="btn" href="#parti">Nous rejoindre</a><a class="btn alt" href="#programme">Lire le programme</a></div>
 <div class="stats">${PARTI.stats.map(s=>`<div><b>${s[0]}</b>${s[1]}</div>`).join('')}</div>
</div>${ph('Photo principale du hero (portrait ou meeting)')}</div></section>

<section class="s"><div class="w"><div class="head"><h2>Notre programme</h2><a class="btn alt" href="#programme">Voir le programme complet</a></div>
<div class="grid">${PROGRAMME.map((p,i)=>`<button class="tab" data-prog="${i}"><h3>${p.t}</h3><span>${p.p.length} propositions</span></button>`).join('')}</div></div></section>

<section class="s alt"><div class="w"><div class="head"><h2>Agenda</h2><a class="btn alt" href="#agenda">Tous les événements</a></div>
<div class="grid">${EVENTS.map(eventCard).join('')}</div></div></section>

<section class="s" id="actus"><div class="w"><div class="head"><h2>Actualités</h2></div>
<div class="grid">${NEWS.map(n=>`<article class="card">${ph('Image de l’article')}<div class="b"><span class="tag">${n.c}</span><h3>${n.t}</h3><p>${n.x}</p><p style="margin-top:10px;font-size:.85rem">${n.d}</p></div></article>`).join('')}</div></div></section>`,

programme:()=>`<div class="page"><div class="w"><h1>Notre programme</h1><p>Six grands axes, des propositions concrètes.</p>
<div class="prog"><aside class="side">${PROGRAMME.map((p,i)=>`<a href="#programme" data-prog="${i}">${p.t}</a>`).join('')}</aside>
<div>${PROGRAMME.map((p,i)=>`<article class="pt" id="p${i}"><h2>${p.t}</h2><p><b>${p.r}</b></p><ul>${p.p.map(x=>`<li>${x}</li>`).join('')}</ul></article>`).join('')}</div></div></div></div>`,

agenda:()=>`<div class="page"><div class="w"><h1>Agenda</h1><p>Retrouvez tous nos rendez-vous.</p>
${EVENTS.map(e=>`<article class="ev">${ph('Photo de l’événement')}<div class="b"><span class="tag">${e.d}</span><h2 style="font-size:1.6rem">${e.t}</h2><p><b>${e.l}</b></p><p>${e.x}</p><a class="btn sm" href="#parti">S’inscrire</a></div></article>`).join('')}</div></div>`,

parti:()=>`<div class="page"><div class="w"><h1>Notre Parti</h1>
<div class="two"><div><h2>Nos origines</h2><p>Racontez ici comment le parti est né, par qui, et pourquoi. Quelques paragraphes sur le contexte de la fondation.</p><p>Ajoutez ensuite ce que le parti représente aujourd’hui et sa vision pour le pays.</p></div>${ph('Photo des fondateurs')}</div>
<h2>Nos valeurs</h2><div class="vals" style="margin-bottom:56px">${PARTIE.valeurs.map(v=>`<div><h3>${v[0]}</h3><p>${v[1]}</p></div>`).join('')}</div>
<div class="two"><div><h2>Notre histoire</h2><div class="tl">${PARTIE.histoire.map(h=>`<div><b>${h[0]} – ${h[1]}</b><br>${h[2]}</div>`).join('')}</div></div>${ph('Photo de l’équipe dirigeante')}</div>
<h2>Nous rejoindre</h2><p>Adhérez, devenez bénévole ou faites un don.</p><a class="btn" href="#parti">Adhérer</a></div></div>`,

boutique:()=>`<div class="page"><div class="w"><h1>Boutique</h1><div class="note">Boutique de démonstration : aucun paiement n’est réellement effectué.</div>
<div class="grid">${SHOP.map((s,i)=>`<article class="card">${ph('Photo produit (1:1)')}<div class="b"><h3>${s.n}</h3><div class="row"><span class="price">${s.p} €</span><button class="btn sm" data-add="${i}">Ajouter</button></div></div></article>`).join('')}</div></div></div>`
};

function drawCart(){
 const tot=cart.reduce((a,i)=>a+SHOP[i].p,0);
 $('#cart').innerHTML=(open?`<div class="pan"><h3>Panier</h3>${cart.length?cart.map((i,k)=>`<div><span>${SHOP[i].n}</span><span>${SHOP[i].p} € <button data-rm="${k}" aria-label="Retirer" style="border:0;background:none;cursor:pointer;color:var(--mute)">✕</button></span></div>`).join('')+`<p class="price" style="margin:12px 0">Total : ${tot} €</p><button class="btn sm" data-pay>Commander</button>`:'<p>Votre panier est vide.</p>'}</div>`:'')+`<button data-tog>Panier (${cart.length})</button>`;
}
function render(){
 const h=(location.hash||'#accueil').slice(1),k=V[h]?h:'accueil';
 $('#app').innerHTML=V[k]();
 $('#nav').innerHTML=LINKS.map(l=>`<a href="#${l[0]}" class="${l[0]==k?'on':''}">${l[1]}</a>`).join('');
 $('#cart').style.display=k=='boutique'?'':'none';
 document.title=PARTI.nom+(k=='accueil'?'':' – '+LINKS.find(l=>l[0]==k)[1]);
 window.scrollTo(0,0);
}
function goProg(i){location.hash='programme';setTimeout(()=>{const e=document.getElementById('p'+i);e&&e.scrollIntoView({behavior:'smooth'})},50)}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-prog],[data-add],[data-rm],[data-tog],[data-pay]');if(!t)return;
 const d=t.dataset;
 if('prog' in d){e.preventDefault();if(location.hash=='#programme'){document.getElementById('p'+d.prog).scrollIntoView({behavior:'smooth'})}else goProg(d.prog)}
 if('add' in d){cart.push(+d.add);open=true;drawCart()}
 if('rm' in d){cart.splice(+d.rm,1);drawCart()}
 if('tog' in d){open=!open;drawCart()}
 if('pay' in d){alert('Boutique de démonstration : aucune commande n’a été passée.');cart=[];open=false;drawCart()}
});
$('#nom').textContent=PARTI.nom;
$('#foot').innerHTML=`<div><h3>${PARTI.nom}</h3><small>${PARTI.slogan}</small></div><div><b>Pages</b><br>${LINKS.map(l=>`<a href="#${l[0]}">${l[1]}</a>`).join('')}</div><div><b>Contact</b><br><a>${PARTI.contact.mail}</a><a>${PARTI.contact.tel}</a><a>${PARTI.contact.adresse}</a></div>`;
addEventListener('hashchange',render);render();drawCart();
</script>
</body>
</html>
